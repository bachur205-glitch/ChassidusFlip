      - name: Build APK
        working-directory: ChassidusFlip
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        working-directory: ChassidusFlip
        run: cp app/build/outputs/apk/debug/app-debug.apk chassidusflip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chassidusflip-apk
          path: ChassidusFlip/chassidusflip.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChassidusFlip/chassidusflip.apk
